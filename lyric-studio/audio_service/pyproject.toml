[project]
name = "audio_service"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "librosa>=0.10",
  "numpy>=1.26",
  "soundfile>=0.12",
  "pydantic>=2.6",
  "python-multipart>=0.0.9",
  "pedalboard>=0.9",
  "pyrubberband>=0.3",
  "pyloudnorm>=0.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
